<script>
var SCRIPT  = 'https://script.google.com/macros/s/AKfycbyrsPdX8RXAUUg77pdtj6_E4Fl_1DWCPECdy3rnYz-vvSLHtKbCTORWJfsFH7CAggW1/exec';
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS_uhZPwcoABZBlg3B3EmTniWUT4REz-ln6nxKrV55mPSt9KA2t-OSrdQmrnn1PLeqOxOjawQP9vPMt/pub?gid=0&single=true&output=csv';

var entries = [];

function sync(s) {
  console.log("SYNC:", s);
}

function toast(msg) {
  console.log("TOAST:", msg);
}

function parseCSV(text) {
  return text.trim().split('\n').map(function(line){
    return line.split(',');
  });
}

function load(cb) {
  console.log("Cargando datos...");

  fetch(CSV_URL + '&t=' + Date.now())
    .then(r => r.text())
    .then(text => {
      console.log("CSV RAW:", text);

      var rows = parseCSV(text);

      // ⚠️ saltar encabezado
      rows.shift();

      entries = rows.map(function(r){
        return {
          id: r[0],
          fecha: r[1],
          pagador: r[2],
          categoria: r[3],
          detalle: r[4],
          importe: parseFloat(r[5]) || 0,
          pagado: r[6] === 'Si'
        };
      });

      console.log("ENTRIES:", entries);

      if(cb) cb();
    })
    .catch(err => {
      console.error("ERROR FETCH:", err);
      toast('Error cargando datos');
    });
}

function post(body, cb) {
  fetch(SCRIPT, {
    method: 'POST',
    headers: {'Content-Type':'text/plain'},
    body: JSON.stringify(body)
  })
  .then(r => r.text())
  .then(() => {
    if(cb) cb(true);
  })
  .catch(() => {
    if(cb) cb(false);
  });
}

// 🔁 REFRESH AUTOMÁTICO (cada 5 segundos)
setInterval(function(){
  load();
}, 5000);

</script>
