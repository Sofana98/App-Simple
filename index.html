<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compartidos">
<title>Gastos Compartidos S&G</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #F7F6F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1A1916; min-height: 100vh; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px 24px; max-width: 430px; margin: 0 auto; }
.login-emoji { font-size: 56px; margin-bottom: 16px; }
.login-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
.login-sub { font-size: 15px; color: #888; margin-bottom: 48px; }
.login-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.login-btn { width: 100%; padding: 20px; border: 2px solid #E0DDD6; border-radius: 16px; font-size: 20px; font-weight: 800; cursor: pointer; background: #fff; font-family: inherit; text-align: center; touch-action: manipulation; }
.login-btn.sofi { border-color: #F0B8CB; color: #C9406A; background: #FDF0F4; }
.login-btn.guille { border-color: #BFDBFE; color: #2563EB; background: #EFF6FF; }
.header { background: #1A1916; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
.header-title { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
.header-title span { color: #F0C040; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-user { font-size: 12px; font-weight: 700; color: #F0C040; }
.switch-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; touch-action: manipulation; }
.sync-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; }
.sync-pill.ok { background: rgba(22,163,74,0.2); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.sync-pill.syncing { background: rgba(217,119,6,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
.sync-pill.error { background: rgba(220,38,38,0.2); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.blink { animation: blink 1s infinite; }
.tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #fff; border-bottom: 1px solid #E8E4DC; position: sticky; top: 53px; z-index: 19; }
.tab { padding: 12px 4px; text-align: center; font-size: 13px; font-weight: 600; color: #999; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #1A1916; border-bottom-color: #F0C040; }
.content { flex: 1; }
.section { display: none; padding: 14px 14px 90px; }
.section.active { display: block; }
.card { background: #fff; border: 1px solid #E8E4DC; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field > label { display: block; font-size: 11px; font-weight: 700; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.07em; }
.field input[type=text], .field input[type=number], .field input[type=date] { width: 100%; font-size: 16px; color: #1A1916; background: #F7F6F2; border: 1px solid #E0DDD6; border-radius: 10px; padding: 11px 13px; font-family: inherit; outline: none; -webkit-appearance: none; }
.field input:focus { border-color: #1A1916; background: #fff; }
.toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
.tb { flex: 1; min-width: 70px; padding: 10px 8px; border: 1.5px solid #E0DDD6; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; background: #F7F6F2; color: #999; font-family: inherit; text-align: center; touch-action: manipulation; }
.tb.sel { background: #fff; border-color: #1A1916; color: #1A1916; }
.tb.sel.sofi-s { background: #FDF0F4; border-color: #C9406A; color: #C9406A; }
.tb.sel.guille-s { background: #EFF6FF; border-color: #2563EB; color: #2563EB; }
.tb.sel.cat-s { background: #F5F3FF; border-color: #6D28D9; color: #6D28D9; }
.save-btn { width: 100%; padding: 15px; background: #1A1916; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 4px; touch-action: manipulation; }
.save-btn:disabled { opacity: 0.4; }
.save-btn.editing { background: #2563EB; }
.cancel-btn { width: 100%; padding: 13px; background: transparent; color: #888; border: 1px solid #E0DDD6; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; touch-action: manipulation; }
.edit-banner { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: #2563EB; font-weight: 600; }
.month-sel { width: 100%; font-size: 15px; background: #fff; border: 1px solid #E8E4DC; border-radius: 10px; padding: 10px 13px; font-family: inherit; -webkit-appearance: none; color: #1A1916; outline: none; margin-bottom: 12px; display: block; }
.entry { padding: 12px 0; border-bottom: 1px solid #F0EDE6; }
.entry:last-child { border-bottom: none; }
.entry-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.entry-name { font-size: 15px; font-weight: 600; }
.entry-obs { font-size: 12px; color: #999; margin-top: 2px; }
.entry-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.entry-amount { font-size: 16px; font-weight: 800; color: #DC2626; }
.edit-btn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 15px; padding: 4px 5px; touch-action: manipulation; }
.del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 4px 5px; touch-action: manipulation; }
.entry-meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.bs { background: #FDF0F4; color: #C9406A; }
.bg { background: #EFF6FF; color: #2563EB; }
.bcat { background: #F5F4F0; color: #666; border: 1px solid #E0DDD6; }
.edate { font-size: 11px; color: #bbb; }
.empty { text-align: center; padding: 40px 20px; color: #bbb; font-size: 14px; }
.lmsg { text-align: center; padding: 32px; color: #bbb; font-size: 14px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: #fff; border: 1px solid #E8E4DC; border-radius: 12px; padding: 13px 14px; }
.slabel { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.sval { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.sval.red { color: #DC2626; }
.balance-card { border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.balance-card.debe { background: #FFFBEB; border: 1px solid #FDE68A; }
.balance-card.ok { background: #F0FDF4; border: 1px solid #BBF7D0; }
.b-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.balance-card.debe .b-label { color: #92400E; }
.balance-card.ok .b-label { color: #166534; }
.b-main { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.balance-card.debe .b-main { color: #B45309; }
.balance-card.ok .b-main { color: #16A34A; }
.b-sub { font-size: 12px; margin-top: 4px; opacity: 0.65; }
.saldo-card { background: #F0F9FF; border: 1px solid #BAE6FD; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.saldo-label { font-size: 11px; font-weight: 800; color: #0369A1; text-transform: uppercase; letter-spacing: 0.06em; }
.saldo-val { font-size: 13px; font-weight: 800; color: #0369A1; text-align: right; }
.cats-card { background: #fff; border: 1px solid #E8E4DC; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.cats-title { font-size: 11px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
.bar-row { margin-bottom: 12px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.bar-name { font-size: 13px; color: #1A1916; font-weight: 500; }
.bar-val { font-size: 13px; font-weight: 700; }
.bar-track { height: 7px; background: #F0EDE6; border-radius: 4px; }
.bar-fill { height: 7px; border-radius: 4px; }
.res-entry { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #F0EDE6; gap: 8px; }
.res-entry:last-child { border-bottom: none; }
.res-left { flex: 1; min-width: 0; }
.res-name { font-size: 13px; color: #1A1916; font-weight: 500; }
.res-meta { font-size: 11px; color: #aaa; margin-top: 2px; }
.res-right { text-align: right; flex-shrink: 0; }
.res-total { font-size: 14px; font-weight: 800; color: #DC2626; }
.res-split { font-size: 11px; color: #888; margin-top: 2px; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #1A1916; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; white-space: nowrap; max-width: 88vw; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-emoji">🤝</div>
  <div class="login-title">Compartidos S&G</div>
  <div class="login-sub">Hola! Toca tu nombre</div>
  <div class="login-btns">
    <button type="button" class="login-btn sofi" id="btn-sofi">🌸 Sofi</button>
    <button type="button" class="login-btn guille" id="btn-guille">🏴‍☠️ Guille</button>
  </div>
</div>

<div id="main-app" style="display:none">
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">Compartidos <span>S&G</span></div>
      <div class="header-user" id="header-user"></div>
    </div>
    <div class="header-right">
      <div class="sync-pill syncing" id="spill">
        <div class="sync-dot blink" id="sdot"></div>
        <span id="stxt">Conectando</span>
      </div>
      <button type="button" class="switch-btn" id="btn-cambiar">Cambiar</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tbtn-cargar">➕ Cargar</div>
    <div class="tab" id="tbtn-historial">📋 Historial</div>
    <div class="tab" id="tbtn-resumen">📊 Resumen</div>
  </div>
  <div class="content">

    <div id="tab-cargar" class="section active">
      <div id="edit-banner" class="edit-banner" style="display:none">✏️ Editando — modificá y guardá</div>
      <div class="card">
        <div class="field">
          <label>Quien pago</label>
          <div class="toggle-row">
            <button type="button" class="tb sel sofi-s" data-group="pag" data-val="Sofi">🌸 Sofi</button>
            <button type="button" class="tb guille-s" data-group="pag" data-val="Guille">🏴‍☠️ Guille</button>
          </div>
        </div>
        <div class="field">
          <label>Categoria</label>
          <div class="toggle-row" id="cat-row"></div>
        </div>
        <div class="field">
          <label>Importe total ($)</label>
          <input type="number" id="importe" placeholder="0" inputmode="decimal" min="0" />
        </div>
        <div class="field">
          <label>Fecha</label>
          <input type="date" id="fecha" />
        </div>
        <div class="field">
          <label>Observacion (opcional)</label>
          <input type="text" id="observacion" placeholder="Ej: mes de abril, cuotas, etc..." autocomplete="off" />
        </div>
      </div>
      <button type="button" class="save-btn" id="savebtn">Guardar</button>
      <button type="button" class="cancel-btn" id="cancelbtn" style="display:none">Cancelar edicion</button>
    </div>

    <div id="tab-historial" class="section">
      <select id="h-mes" class="month-sel"></select>
      <div class="card" id="h-list"><div class="lmsg">Cargando...</div></div>
    </div>

    <div id="tab-resumen" class="section">
      <select id="r-mes" class="month-sel"></select>
      <div id="r-content"><div class="lmsg">Cargando...</div></div>
    </div>

  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
var SCRIPT  = 'https://script.google.com/macros/s/AKfycbxVrJ1GJnOJrY9hMIZjgG4SwRQuefW4wwZAW9SfHoPZpykWFRR0OoytdpYJGW9Tjxhx5w/exec';
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQIiU3cnMG2aC9O0OmLqE-DmdI11UobljHNFw2GWEiGO7iMggCPqdbigKa1oCCxZHYz-oaQyHMOYX6k/pub?gid=0&single=true&output=csv';

var CATS = ['🏠 Alquiler','🗒️ Expensas','💡 Luz','💧 Agua','🔥 Gas','🛜 Internet','🥗 Verduleria','🥩 Carnes','🛒 Super','🚗 Auto','🎉 Salidas','🚕 Ubers','🍕 Delivery','🧹 Limpieza','🔧 Mantenimiento'];
var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

var usuario = null;
var state = { pag:'Sofi', cat:CATS[0] };
var entries = [];
var editingId = null;

function todayStr() { var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function mk(f) { var d=new Date(f); return isNaN(d.getTime())?'':d.getFullYear()+'-'+d.getMonth(); }
function curMK() { var d=new Date(); return d.getFullYear()+'-'+d.getMonth(); }
function ars(n) { return '$'+Math.round(n).toLocaleString('es-AR'); }
function fmtDate(f) { return new Date(f).toLocaleDateString('es-AR',{day:'numeric',month:'short'}); }

function sync(s) {
  var p=document.getElementById('spill'),d=document.getElementById('sdot'),t=document.getElementById('stxt');
  p.className='sync-pill '+s; d.className='sync-dot'+(s==='syncing'?' blink':'');
  t.textContent=s==='ok'?'Sincronizado':s==='syncing'?'Sincronizando':'Sin conexion';
}
function toast(msg) {
  var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); },2500);
}
function parseCSV(text) {
  return text.trim().split('\n').map(function(line){
    var result=[],cur='',inQ=false;
    for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){result.push(cur.trim());cur='';}else{cur+=c;}}
    result.push(cur.trim()); return result;
  });
}

function initCats() {
  document.getElementById('cat-row').innerHTML = CATS.map(function(c){
    return '<button type="button" class="tb'+(c===state.cat?' sel cat-s':'')+'" data-group="cat" data-val="'+c+'">'+c+'</button>';
  }).join('');
}

function setUsuario(u) {
  usuario=u;
  try { localStorage.setItem('comp_user',u); } catch(e) {}
  document.getElementById('login').style.display='none';
  document.getElementById('main-app').style.display='block';
  document.getElementById('header-user').textContent='Hola, '+u+'!';
  state.pag=u;
  document.querySelectorAll('[data-group="pag"]').forEach(function(b){ b.classList.remove('sel'); });
  var pb=document.querySelector('[data-group="pag"][data-val="'+u+'"]'); if(pb) pb.classList.add('sel');
  document.getElementById('fecha').value=todayStr();
  initCats();
  load(function(){
    document.getElementById('h-mes').value=curMK();
    document.getElementById('r-mes').value=curMK();
    renderHist(); renderRes();
  });
}
function cambiarUsuario() {
  try { localStorage.removeItem('comp_user'); } catch(e) {}
  document.getElementById('login').style.display='flex';
  document.getElementById('main-app').style.display='none';
}
document.getElementById('btn-sofi').addEventListener('click',function(){ setUsuario('Sofi'); });
document.getElementById('btn-guille').addEventListener('click',function(){ setUsuario('Guille'); });
document.getElementById('btn-cambiar').addEventListener('click',cambiarUsuario);

function load(cb) {
  sync('syncing');
  fetch(CSV_URL+'&t='+Date.now())
    .then(function(r){ return r.text(); })
    .then(function(text){
      entries=parseCSV(text).map(function(r){
        // Columnas: id, fecha, pagador, categoria, importe, observacion, pagado
        return {id:String(r[0]),fecha:r[1],pagador:r[2],categoria:r[3],importe:parseFloat(r[4])||0,observacion:r[5]||'',pagado:r[6]==='Si'};
      }).filter(function(e){ return e.id && e.importe > 0; });
      sync('ok'); fillMonths(); if(cb) cb();
    })
    .catch(function(){ sync('error'); toast('Sin conexion'); if(cb) cb(); });
}
function post(body,cb) {
  sync('syncing');
  fetch(SCRIPT,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
    .then(function(r){ return r.text(); })
    .then(function(){ sync('ok'); if(cb) cb(true); })
    .catch(function(){ sync('error'); if(cb) cb(false); });
}

document.addEventListener('click',function(e){
  var btn=e.target.closest('[data-group]'); if(!btn) return;
  var group=btn.getAttribute('data-group'),val=btn.getAttribute('data-val');
  var container=btn.closest('.toggle-row'); if(!container) return;
  container.querySelectorAll('[data-group="'+group+'"]').forEach(function(b){ b.classList.remove('sel','sofi-s','guille-s','cat-s'); });
  btn.classList.add('sel');
  if(group==='pag'){ state.pag=val; btn.classList.add(val==='Sofi'?'sofi-s':'guille-s'); }
  if(group==='cat'){ state.cat=val; btn.classList.add('cat-s'); }
});

function showTab(t) {
  ['cargar','historial','resumen'].forEach(function(n){
    document.getElementById('tab-'+n).classList.toggle('active',n===t);
    document.getElementById('tbtn-'+n).classList.toggle('active',n===t);
  });
  if(t==='historial') load(renderHist);
  if(t==='resumen') load(renderRes);
}
document.getElementById('tbtn-cargar').addEventListener('click',function(){ showTab('cargar'); });
document.getElementById('tbtn-historial').addEventListener('click',function(){ showTab('historial'); });
document.getElementById('tbtn-resumen').addEventListener('click',function(){ showTab('resumen'); });
document.getElementById('h-mes').addEventListener('change',renderHist);
document.getElementById('r-mes').addEventListener('change',renderRes);

function resetForm() {
  editingId=null;
  document.getElementById('edit-banner').style.display='none';
  document.getElementById('savebtn').textContent='Guardar';
  document.getElementById('savebtn').classList.remove('editing');
  document.getElementById('cancelbtn').style.display='none';
  document.getElementById('importe').value='';
  document.getElementById('fecha').value=todayStr();
  document.getElementById('observacion').value='';
  state.pag=usuario||'Sofi'; state.cat=CATS[0];
  document.querySelectorAll('[data-group="pag"]').forEach(function(b){ b.classList.remove('sel','sofi-s','guille-s'); });
  var pb=document.querySelector('[data-group="pag"][data-val="'+(usuario||'Sofi')+'"]');
  if(pb){ pb.classList.add('sel'); pb.classList.add(usuario==='Sofi'?'sofi-s':'guille-s'); }
  initCats();
}
document.getElementById('cancelbtn').addEventListener('click',resetForm);

document.getElementById('savebtn').addEventListener('click',function(){
  var imp=parseFloat(document.getElementById('importe').value);
  if(!imp||imp<=0){ toast('Ingresa un importe valido'); return; }
  var fechaVal=document.getElementById('fecha').value;
  if(!fechaVal){ toast('Ingresa una fecha'); return; }
  var obs=document.getElementById('observacion').value.trim();
  var btn=document.getElementById('savebtn'); btn.disabled=true; btn.textContent='Guardando...';
  var body={action:editingId?'edit':'add',id:editingId||Date.now()+'',
    fecha:new Date(fechaVal+'T12:00:00').toISOString(),
    pagador:state.pag,categoria:state.cat,importe:imp,observacion:obs,pagado:'No'};
  post(body,function(ok){
    btn.disabled=false;
    if(ok){ toast(editingId?'Cambios guardados!':'Guardado!'); resetForm(); setTimeout(function(){ load(); },2000); }
    else{ btn.textContent='Guardar'; toast('Error al guardar'); }
  });
});

function editEntry(id) {
  var e=entries.find(function(x){ return x.id===id; }); if(!e) return;
  editingId=id; showTab('cargar');
  document.getElementById('edit-banner').style.display='';
  document.getElementById('savebtn').textContent='Guardar cambios';
  document.getElementById('savebtn').classList.add('editing');
  document.getElementById('cancelbtn').style.display='';
  state.pag=e.pagador; state.cat=e.categoria;
  document.querySelectorAll('[data-group="pag"]').forEach(function(b){ b.classList.remove('sel','sofi-s','guille-s'); });
  var pb=document.querySelector('[data-group="pag"][data-val="'+e.pagador+'"]');
  if(pb){ pb.classList.add('sel'); pb.classList.add(e.pagador==='Sofi'?'sofi-s':'guille-s'); }
  var d=new Date(e.fecha);
  if(!isNaN(d.getTime())) document.getElementById('fecha').value=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  document.getElementById('importe').value=e.importe;
  document.getElementById('observacion').value=e.observacion||'';
  initCats();
  window.scrollTo(0,0);
}

function fillMonths() {
  var keys=[]; entries.forEach(function(e){ var k=mk(e.fecha); if(k&&keys.indexOf(k)<0) keys.push(k); });
  keys.sort().reverse();
  var cur=curMK(); if(keys.indexOf(cur)<0) keys.unshift(cur);
  var opts=keys.map(function(k){ var p=k.split('-'); return '<option value="'+k+'">'+MESES[+p[1]]+' '+p[0]+'</option>'; }).join('');
  document.getElementById('h-mes').innerHTML=opts; document.getElementById('r-mes').innerHTML=opts;
  document.getElementById('h-mes').value=cur; document.getElementById('r-mes').value=cur;
}

function renderHist() {
  var key=document.getElementById('h-mes').value;
  var list=entries.filter(function(e){ return mk(e.fecha)===key; });
  list.sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
  var el=document.getElementById('h-list');
  if(!list.length){ el.innerHTML='<div class="empty">Sin registros este mes</div>'; return; }
  el.innerHTML=list.map(function(e){
    return '<div class="entry">'
      +'<div class="entry-top"><div style="min-width:0;flex:1;">'
      +'<div class="entry-name">'+e.categoria+'</div>'
      +(e.observacion?'<div class="entry-obs">'+e.observacion+'</div>':'')
      +'</div>'
      +'<div class="entry-right"><div class="entry-amount">'+ars(e.importe)+'</div>'
      +'<button type="button" class="edit-btn" data-id="'+e.id+'">✏️</button>'
      +'<button type="button" class="del-btn" data-id="'+e.id+'">✕</button>'
      +'</div></div>'
      +'<div class="entry-meta">'
      +'<span class="badge '+(e.pagador==='Sofi'?'bs':'bg')+'">'+e.pagador+' pago</span>'
      +'<span class="edate">'+fmtDate(e.fecha)+'</span>'
      +'</div></div>';
  }).join('');
  el.querySelectorAll('.edit-btn').forEach(function(b){ b.addEventListener('click',function(){ editEntry(this.getAttribute('data-id')); }); });
  el.querySelectorAll('.del-btn').forEach(function(b){ b.addEventListener('click',function(){ delEntry(this.getAttribute('data-id')); }); });
}

function delEntry(id) {
  if(!confirm('Eliminas este gasto?')) return;
  post({action:'delete',id:id},function(ok){
    if(ok){ toast('Eliminado'); setTimeout(function(){ load(renderHist); },2000); }
    else toast('Error al eliminar');
  });
}

function calcNeto(key) {
  var list=entries.filter(function(e){ return mk(e.fecha)===key; });
  var dSofi=0,dGuille=0;
  list.forEach(function(e){
    if(e.pagador==='Guille') dSofi+=e.importe/2;
    else dGuille+=e.importe/2;
  });
  return dSofi-dGuille;
}

function calcSaldoAnt(key) {
  var p=key.split('-'),year=parseInt(p[0]),month=parseInt(p[1]),total=0,keys=[];
  entries.forEach(function(e){ var k=mk(e.fecha); if(k&&keys.indexOf(k)<0) keys.push(k); });
  keys.forEach(function(k){
    var kp=k.split('-'),ky=parseInt(kp[0]),km=parseInt(kp[1]);
    if(ky<year||(ky===year&&km<month)) total+=calcNeto(k);
  });
  return total;
}

function renderRes() {
  var key=document.getElementById('r-mes').value;
  var list=entries.filter(function(e){ return mk(e.fecha)===key; });
  var total=list.reduce(function(a,b){ return a+b.importe; },0);
  var netoMes=calcNeto(key);
  var saldoAnt=calcSaldoAnt(key);
  var netoTotal=netoMes+saldoAnt;
  var h='';

  h+='<div class="stat-grid">'
    +'<div class="stat"><div class="slabel">Total del mes</div><div class="sval red">'+ars(total)+'</div></div>'
    +'<div class="stat"><div class="slabel">Mitad c/u</div><div class="sval red">'+ars(total/2)+'</div></div>'
    +'</div>';

  if(Math.abs(saldoAnt)>1){
    var sAntTxt=saldoAnt>0?'Sofi venia debiendo '+ars(Math.abs(saldoAnt)):'Guille venia debiendo '+ars(Math.abs(saldoAnt));
    h+='<div class="saldo-card"><div class="saldo-label">Saldo anterior</div><div class="saldo-val">'+sAntTxt+'</div></div>';
  }

  var balOk=Math.abs(netoTotal)<1;
  var balTxt,balSub='';
  if(balOk){ balTxt='Estan al dia! 🎉'; }
  else if(netoTotal>0){
    balTxt='Sofi le debe a Guille '+ars(Math.abs(netoTotal));
    balSub='Este mes: '+ars(Math.abs(netoMes))+(Math.abs(saldoAnt)>1?' + arrastre '+ars(Math.abs(saldoAnt)):'');
  } else {
    balTxt='Guille le debe a Sofi '+ars(Math.abs(netoTotal));
    balSub='Este mes: '+ars(Math.abs(netoMes))+(Math.abs(saldoAnt)>1?' + arrastre '+ars(Math.abs(saldoAnt)):'');
  }
  h+='<div class="balance-card '+(balOk?'ok':'debe')+'">'
    +'<div class="b-label">Balance'+(Math.abs(saldoAnt)>1?' acumulado':'')+'</div>'
    +'<div class="b-main">'+balTxt+'</div>'
    +(balSub?'<div class="b-sub">'+balSub+'</div>':'')
    +'</div>';

  if(list.length){
    var pc={};
    list.forEach(function(e){ pc[e.categoria]=(pc[e.categoria]||0)+e.importe; });
    var cl=Object.entries(pc).sort(function(a,b){ return b[1]-a[1]; });
    var mx=cl[0][1];
    h+='<div class="cats-card"><div class="cats-title">Por categoria</div>';
    cl.forEach(function(item){
      var pS=list.filter(function(e){ return e.categoria===item[0]&&e.pagador==='Sofi'; }).reduce(function(a,b){ return a+b.importe; },0);
      var pG=list.filter(function(e){ return e.categoria===item[0]&&e.pagador==='Guille'; }).reduce(function(a,b){ return a+b.importe; },0);
      var color=pS>=pG?'#C9406A':'#2563EB';
      h+='<div class="bar-row">'
        +'<div class="bar-top"><span class="bar-name">'+item[0]+'</span><span class="bar-val">'+ars(item[1])+'</span></div>'
        +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.round(item[1]/mx*100)+'%;background:'+color+';height:7px;border-radius:4px;"></div></div>'
        +'<div style="display:flex;gap:10px;margin-top:3px;">'
        +(pS>0?'<span style="font-size:11px;color:#C9406A;">Sofi '+ars(pS)+'</span>':'')
        +(pG>0?'<span style="font-size:11px;color:#2563EB;">Guille '+ars(pG)+'</span>':'')
        +'</div></div>';
    });
    h+='</div>';

    h+='<div class="card"><div style="font-size:11px;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;">Todos los gastos</div>';
    var sorted=[].concat(list).sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
    sorted.forEach(function(e){
      h+='<div class="res-entry">'
        +'<div class="res-left"><div class="res-name">'+e.categoria+(e.observacion?' <span style="font-size:11px;color:#aaa;font-weight:400;">'+e.observacion+'</span>':'')+'</div>'
        +'<div class="res-meta">'+fmtDate(e.fecha)+'</div></div>'
        +'<div class="res-right"><div class="res-total">'+ars(e.importe)+'</div>'
        +'<div class="res-split"><span style="color:'+(e.pagador==='Sofi'?'#C9406A':'#2563EB')+'">'+e.pagador+'</span> · c/u '+ars(e.importe/2)+'</div>'
        +'</div></div>';
    });
    h+='</div>';
  } else {
    h+='<div class="empty">Sin gastos este mes</div>';
  }

  document.getElementById('r-content').innerHTML=h;
}

try { var su=localStorage.getItem('comp_user'); if(su) setUsuario(su); } catch(e) {}
