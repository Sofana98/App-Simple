<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compartidos">
<title>Gastos Compartidos S&G</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #F7F6F2; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1A1916; min-height: 100vh; }
.app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px 24px; max-width: 430px; margin: 0 auto; }
.login-emoji { font-size: 56px; margin-bottom: 16px; }
.login-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
.login-sub { font-size: 15px; color: #888; margin-bottom: 48px; }
.login-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.login-btn { width: 100%; padding: 20px; border: 2px solid #E0DDD6; border-radius: 16px; font-size: 20px; font-weight: 800; cursor: pointer; background: #fff; font-family: inherit; touch-action: manipulation; }
.login-btn.sofi { border-color: #F0B8CB; color: #C9406A; background: #FDF0F4; }
.login-btn.guille { border-color: #BFDBFE; color: #2563EB; background: #EFF6FF; }
.header { background: #1A1916; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
.header-title { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
.header-title span { color: #F0C040; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-user { font-size: 12px; font-weight: 700; color: #F0C040; }
.switch-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
.sync-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; }
.sync-pill.ok { background: rgba(22,163,74,0.2); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.sync-pill.syncing { background: rgba(217,119,6,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
.sync-pill.error { background: rgba(220,38,38,0.2); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.blink { animation: blink 1s infinite; }
.quick { background: #1A1916; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.quick label { display: block; font-size: 11px; font-weight: 700; color: #F0C040; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.07em; }
.quick-row { display: flex; gap: 8px; }
.quick input { flex: 1; min-width: 0; font-size: 16px; border: none; border-radius: 10px; padding: 11px 13px; font-family: inherit; outline: none; }
.quick button { padding: 0 14px; border: none; border-radius: 10px; background: #F0C040; color: #1A1916; font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer; }
.quick-hint { font-size: 12px; color: #aaa; margin-top: 8px; min-height: 16px; }
.reco { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0EDE6; }
.reco:last-child { border-bottom: none; }
.reco-ico { font-size: 22px; flex-shrink: 0; }
.reco-t { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.reco-d { font-size: 13px; color: #666; line-height: 1.4; }
.reco-save { display: inline-block; margin-top: 5px; font-size: 12px; font-weight: 700; color: #16A34A; background: #F0FDF4; border-radius: 20px; padding: 2px 8px; }
.trend { display: flex; align-items: flex-end; gap: 6px; height: 110px; margin-top: 4px; }
.trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.trend-bar { width: 100%; background: #E0DDD6; border-radius: 6px 6px 2px 2px; min-height: 3px; }
.trend-bar.cur { background: #F0C040; }
.trend-lbl { font-size: 10px; color: #999; margin-top: 4px; }
.trend-val { font-size: 10px; color: #666; font-weight: 700; margin-bottom: 3px; }
.tb.sel.ing-s { background: #F0FDF4; border-color: #16A34A; color: #16A34A; }
.tb.sel.pers-s { background: #FFF7ED; border-color: #EA580C; color: #EA580C; }
.bpers { background: #FFF7ED; color: #EA580C; }
.bing { background: #F0FDF4; color: #16A34A; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-bottom: 1px solid #E8E4DC; position: sticky; top: 53px; z-index: 19; }
.tab { padding: 10px 1px; text-align: center; font-size: 11px; line-height: 1.5; font-weight: 600; color: #999; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #1A1916; border-bottom-color: #F0C040; }
.content { flex: 1; }
.section { display: none; padding: 14px 14px 90px; }
.section.active { display: block; }
.card { background: #fff; border: 1px solid #E8E4DC; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field > label, .flabel { display: block; font-size: 11px; font-weight: 700; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.07em; }
.field input[type=text], .field input[type=date] { width: 100%; font-size: 16px; color: #1A1916; background: #F7F6F2; border: 1px solid #E0DDD6; border-radius: 10px; padding: 11px 13px; font-family: inherit; outline: none; -webkit-appearance: none; }
.field input:focus { border-color: #1A1916; background: #fff; }
/* Importe grande */
.amount-wrap { display: flex; align-items: center; background: #F7F6F2; border: 1.5px solid #E0DDD6; border-radius: 14px; padding: 6px 14px; }
.amount-wrap:focus-within { border-color: #1A1916; background: #fff; }
.amount-wrap span { font-size: 28px; font-weight: 800; color: #bbb; margin-right: 6px; }
#importe { flex: 1; min-width: 0; border: none; background: transparent; font-size: 32px; font-weight: 800; color: #1A1916; outline: none; font-family: inherit; padding: 6px 0; }
.amount-hint { font-size: 12px; color: #888; margin-top: 6px; min-height: 16px; }
.amount-hint b { color: #1A1916; }
.toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
.tb { flex: 1; min-width: 70px; padding: 10px 8px; border: 1.5px solid #E0DDD6; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; background: #F7F6F2; color: #888; font-family: inherit; text-align: center; touch-action: manipulation; }
.tb.sel { background: #fff; border-color: #1A1916; color: #1A1916; }

.tb.sel.guille-s { background: #EFF6FF; border-color: #2563EB; color: #2563EB; }
/* Categorias en grilla compacta */
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cat-grid .tb { min-width: 0; padding: 9px 4px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.15; }
.cat-grid .tb .ce { font-size: 20px; }
.tb.sel.cat-s { background: #F5F3FF; border-color: #6D28D9; color: #6D28D9; }
.more-btn { width: 100%; margin-top: 8px; padding: 8px; border: 1px dashed #D6D2C8; border-radius: 10px; background: none; color: #888; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
.chip-row { display: flex; gap: 6px; margin-bottom: 8px; }
.chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #E0DDD6; background: #F7F6F2; font-size: 12px; font-weight: 600; color: #888; cursor: pointer; font-family: inherit; }
.chip.sel { background: #1A1916; color: #fff; border-color: #1A1916; }
.adv-toggle { font-size: 12px; color: #888; font-weight: 600; background: none; border: none; cursor: pointer; font-family: inherit; padding: 4px 0; }
.save-btn { width: 100%; padding: 16px; background: #1A1916; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit; touch-action: manipulation; }
.save-btn:disabled { opacity: 0.4; }
.save-btn.editing { background: #2563EB; }
.save-bar { position: sticky; bottom: 0; padding: 10px 0 14px; background: linear-gradient(to bottom, rgba(247,246,242,0), #F7F6F2 30%); }
.cancel-btn { width: 100%; padding: 13px; background: transparent; color: #888; border: 1px solid #E0DDD6; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; }
.edit-banner { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: #2563EB; font-weight: 600; }
.month-sel { width: 100%; font-size: 15px; background: #fff; border: 1px solid #E8E4DC; border-radius: 10px; padding: 10px 13px; font-family: inherit; -webkit-appearance: none; color: #1A1916; outline: none; margin-bottom: 12px; display: block; }
.entry { padding: 12px 0; border-bottom: 1px solid #F0EDE6; }
.entry:last-child { border-bottom: none; }
.entry-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.entry-name { font-size: 15px; font-weight: 600; }
.entry-obs { font-size: 12px; color: #999; margin-top: 2px; }
.entry-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.entry-amount { font-size: 16px; font-weight: 800; color: #DC2626; margin-right: 2px; }
.ibtn { background: none; border: none; color: #bbb; cursor: pointer; font-size: 15px; padding: 4px 5px; }
.entry-meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.bs { background: #FDF0F4; color: #C9406A; }
.bg { background: #EFF6FF; color: #2563EB; }
.bok { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
.edate { font-size: 11px; color: #bbb; }
.empty { text-align: center; padding: 40px 20px; color: #bbb; font-size: 14px; }
.lmsg { text-align: center; padding: 32px; color: #bbb; font-size: 14px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: #fff; border: 1px solid #E8E4DC; border-radius: 12px; padding: 13px 14px; }
.slabel { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.sval { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #DC2626; }
.balance-card { border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.balance-card.debe { background: #FFFBEB; border: 1px solid #FDE68A; }
.balance-card.ok { background: #F0FDF4; border: 1px solid #BBF7D0; }
.b-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.balance-card.debe .b-label { color: #92400E; }
.balance-card.ok .b-label { color: #166534; }
.b-main { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.balance-card.debe .b-main { color: #B45309; }
.balance-card.ok .b-main { color: #16A34A; }
.b-sub { font-size: 12px; margin-top: 4px; opacity: 0.65; }
.saldar-btn { margin-top: 10px; padding: 9px 14px; border-radius: 10px; border: 1px solid #F59E0B; background: #fff; color: #B45309; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; }
.saldo-card { background: #F0F9FF; border: 1px solid #BAE6FD; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.saldo-label { font-size: 11px; font-weight: 800; color: #0369A1; text-transform: uppercase; letter-spacing: 0.06em; }
.saldo-val { font-size: 13px; font-weight: 800; color: #0369A1; text-align: right; }
.cats-title { font-size: 11px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
.bar-row { margin-bottom: 12px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-top { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
.bar-val { font-weight: 700; }
.bar-track { height: 7px; background: #F0EDE6; border-radius: 4px; }
.bar-fill { height: 7px; border-radius: 4px; }
.res-entry { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #F0EDE6; gap: 8px; }
.res-entry:last-child { border-bottom: none; }
.res-left { flex: 1; min-width: 0; }
.res-name { font-size: 13px; font-weight: 500; }
.res-meta { font-size: 11px; color: #aaa; margin-top: 2px; }
.res-right { text-align: right; flex-shrink: 0; }
.res-total { font-size: 14px; font-weight: 800; color: #DC2626; }
.res-split { font-size: 11px; color: #888; margin-top: 2px; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1A1916; color: #fff; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; white-space: nowrap; max-width: 88vw; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-emoji">🤝</div>
  <div class="login-title">Compartidos S&G</div>
  <div class="login-sub">Hola! Toca tu nombre</div>
  <div class="login-btns">
    <button type="button" class="login-btn sofi" id="btn-sofi">🌸 Sofi</button>
    <button type="button" class="login-btn guille" id="btn-guille">🏴‍☠️ Guille</button>
  </div>
</div>

<div id="main-app" style="display:none">
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">Compartidos <span>S&G</span></div>
      <div class="header-user" id="header-user"></div>
    </div>
    <div class="header-right">
      <div class="sync-pill syncing" id="spill"><div class="sync-dot blink" id="sdot"></div><span id="stxt">Conectando</span></div>
      <button type="button" class="switch-btn" id="btn-cambiar">Cambiar</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tbtn-cargar">➕<br>Cargar</div>
    <div class="tab" id="tbtn-historial">📋<br>Historial</div>
    <div class="tab" id="tbtn-resumen">📊<br>Resumen</div>
    <div class="tab" id="tbtn-mio">👤<br>Lo mío</div>
    <div class="tab" id="tbtn-analisis">💡<br>Análisis</div>
  </div>
  <div class="content">

    <div id="tab-cargar" class="section active">
      <div id="edit-banner" class="edit-banner" style="display:none">✏️ Editando — modificá y guardá</div>
      <div class="quick" id="quick-box">
        <label for="quick">⚡ Carga rápida</label>
        <div class="quick-row">
          <input type="text" id="quick" placeholder="3000 gaseosa" autocomplete="off" enterkeyhint="go" />
          <button type="button" id="quick-btn">Listo</button>
        </div>
        <div class="quick-hint" id="quick-hint">Escribí monto + qué fue. Ej: "12500 coto", "4800 uber guille"</div>
      </div>
      <div class="card">
        <div class="field">
          <div class="toggle-row">
            <button type="button" class="tb sel" data-group="modo" data-val="comp">🤝 Compartido</button>
            <button type="button" class="tb" data-group="modo" data-val="pers">👤 Personal</button>
            <button type="button" class="tb" data-group="modo" data-val="ing">💰 Ingreso</button>
          </div>
        </div>
        <!-- 1. Importe primero: es lo único que siempre cambia -->
        <div class="field">
          <label for="importe">¿Cuánto?</label>
          <div class="amount-wrap"><span>$</span>
            <input type="text" id="importe" placeholder="0" inputmode="decimal" autocomplete="off" enterkeyhint="done" />
          </div>
          <div class="amount-hint" id="amount-hint">Podés sumar: 1500+800+320</div>
        </div>
        <!-- 2. Categoría: las más usadas primero -->
        <div class="field">
          <label>¿En qué?</label>
          <div class="toggle-row cat-grid" id="cat-row"></div>
          <button type="button" class="more-btn" id="more-cats">Ver todas ▾</button>
        </div>
        <!-- 3. Quién pagó -->
        <div class="field" id="field-pag">
          <label>¿Quién pagó?</label>
          <div class="toggle-row">
            <button type="button" class="tb sel sofi-s" data-group="pag" data-val="Sofi">🌸 Sofi</button>
            <button type="button" class="tb guille-s" data-group="pag" data-val="Guille">🏴‍☠️ Guille</button>
          </div>
        </div>
        <!-- 4. Fecha con atajos -->
        <div class="field">
          <label>Fecha</label>
          <div class="chip-row">
            <button type="button" class="chip sel" data-day="0">Hoy</button>
            <button type="button" class="chip" data-day="1">Ayer</button>
            <button type="button" class="chip" data-day="2">Anteayer</button>
          </div>
          <input type="date" id="fecha" />
        </div>
        <div class="field">
          <label for="observacion">Nota (opcional)</label>
          <input type="text" id="observacion" list="obs-list" placeholder="Ej: cuota 2/6, Coto..." autocomplete="off" enterkeyhint="done" />
          <datalist id="obs-list"></datalist>
        </div>
        <div class="field" id="field-yapagado">
          <label>Estado del pago</label>
          <div class="toggle-row">
            <button type="button" class="tb sel" data-group="yapagado" data-val="No">Pendiente</button>
            <button type="button" class="tb" data-group="yapagado" data-val="Si">Ya lo pagamos c/u</button>
          </div>
        </div>
      </div>
      <div class="save-bar">
        <button type="button" class="save-btn" id="savebtn">Guardar</button>
        <button type="button" class="cancel-btn" id="cancelbtn" style="display:none">Cancelar</button>
      </div>
    </div>

    <div id="tab-historial" class="section">
      <select id="h-mes" class="month-sel"></select>
      <div class="card" id="h-list"><div class="lmsg">Cargando...</div></div>
    </div>

    <div id="tab-resumen" class="section">
      <select id="r-mes" class="month-sel"></select>
      <div id="r-content"><div class="lmsg">Cargando...</div></div>
    </div>

    <div id="tab-mio" class="section">
      <select id="m-mes" class="month-sel"></select>
      <div id="m-content"><div class="lmsg">Cargando...</div></div>
    </div>

    <div id="tab-analisis" class="section">
      <div id="a-content"><div class="lmsg">Cargando...</div></div>
    </div>

  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
var SCRIPT  = 'https://script.google.com/macros/s/AKfycbxqH0QYOxH4fjvfAGIA6W8IrfuQEUXMTjpl8hsISoQYfhHnz8Doggo9BaAaOA9sLg2g/exec';
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQIiU3cnMG2aC9O0OmLqE-DmdI11UobljHNFw2GWEiGO7iMggCPqdbigKa1oCCxZHYz-oaQyHMOYX6k/pub?gid=0&single=true&output=csv';

var CATS = ['🏠 Alquiler','🗒️ Expensas','💡 Luz','💧 Agua','🔥 Gas','🛜 Internet','🥗 Verduleria','🥩 Carnes','🥐 Panaderia','🛒 Super','💼 Comidas Trabajo','🚗 Auto','🎉 Salidas','🚕 Ubers','🍕 Delivery','🧹 Limpieza','🔧 Mantenimiento','💸 Saldo de deuda'];
var CAT_SALDO = '💸 Saldo de deuda';
// Gastos personales: las mismas (sin saldo de deuda) + algunas propias
var CATS_PERS = CATS.filter(function(c){ return c!==CAT_SALDO; }).concat(['👕 Ropa','💊 Salud','💅 Cuidado personal','📱 Celular','🎁 Regalos','🏋️ Gym','💳 Tarjeta de crédito','📦 Otros']);
var CATS_ING = ['💼 Sueldo','💻 Freelance / extra','🎁 Aguinaldo / bono','🔁 Reintegro','📦 Otro ingreso'];
function catsDeModo(m){ return m==='ing' ? CATS_ING : m==='pers' ? CATS_PERS : CATS; }
function modoDe(e){ return e.tipo==='Ingreso' ? 'ing' : e.ambito==='Personal' ? 'pers' : 'comp'; }
function esComp(e){ return modoDe(e)==='comp'; }
// Lo personal y los ingresos solo los ve quien los cargó
function visible(e){ return esComp(e) || e.pagador===usuario; }
var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var CATS_VISIBLES = 9; // cuántas categorías se ven sin expandir

var usuario = null;
var state = { pag:'Sofi', cat:null, yapagado:'No', modo:'comp' };
var entries = [];
var editingId = null;
var showAllCats = false;

function $(id){ return document.getElementById(id); }
function pad(n){ return ('0'+n).slice(-2); }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function daysAgoStr(n){ var d=new Date(); d.setDate(d.getDate()-n); return dateStr(d); }
function mk(f){ var d=new Date(f); return isNaN(d.getTime())?'':d.getFullYear()+'-'+d.getMonth(); }
function curMK(){ var d=new Date(); return d.getFullYear()+'-'+d.getMonth(); }
function ars(n){ return '$'+Math.round(n).toLocaleString('es-AR'); }
function fmtDate(f){ return new Date(f).toLocaleDateString('es-AR',{day:'numeric',month:'short'}); }
// Evita que una observación con < o " rompa la página
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// Acepta "1500", "1.500", "1500,50", "1.500,50" y sumas "1500+800"
function parseImporte(txt){
  txt=String(txt||'').replace(/\s|\$/g,'');
  if(!txt) return NaN;
  var parts=txt.split('+'), total=0;
  for(var i=0;i<parts.length;i++){
    var p=parts[i]; if(!p) continue;
    if(p.indexOf(',')>=0) p=p.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(p)) p=p.replace(/\./g,'');
    var n=parseFloat(p); if(isNaN(n)) return NaN;
    total+=n;
  }
  return Math.round(total*100)/100;
}

function sync(s){
  $('spill').className='sync-pill '+s; $('sdot').className='sync-dot'+(s==='syncing'?' blink':'');
  $('stxt').textContent=s==='ok'?'Sincronizado':s==='syncing'?'Sincronizando':'Sin conexion';
}
var toastT;
function toast(msg){
  var el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('show'); },2500);
}

function parseCSV(text){
  return text.trim().split(/\r?\n/).map(function(line){
    var result=[],cur='',inQ=false;
    for(var i=0;i<line.length;i++){
      var c=line[i];
      if(c==='"'){ if(inQ&&line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
      else if(c===','&&!inQ){ result.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    result.push(cur.trim());
    return result;
  });
}

/* ---------- Categorías ordenadas por uso ---------- */
function catsOrdenadas(){
  var cnt={}, now=Date.now();
  entries.forEach(function(e){
    if(modoDe(e)!==state.modo || !visible(e)) return;
    // los gastos de los últimos 90 días pesan más
    var w = (now-new Date(e.fecha).getTime()) < 90*864e5 ? 3 : 1;
    cnt[e.categoria]=(cnt[e.categoria]||0)+w;
  });
  var base=catsDeModo(state.modo);
  return base.slice().sort(function(a,b){
    if(a===CAT_SALDO) return 1; if(b===CAT_SALDO) return -1; // saldo siempre al final
    return (cnt[b]||0)-(cnt[a]||0) || base.indexOf(a)-base.indexOf(b);
  });
}
function renderCats(){
  var list=catsOrdenadas();
  var visibles = showAllCats ? list : list.slice(0,CATS_VISIBLES);
  if(state.cat && visibles.indexOf(state.cat)<0) visibles=visibles.concat([state.cat]);
  $('cat-row').innerHTML=visibles.map(function(c){
    var sp=c.indexOf(' '), emo=c.slice(0,sp), name=c.slice(sp+1);
    return '<button type="button" class="tb'+(c===state.cat?' sel cat-s':'')+'" data-group="cat" data-val="'+esc(c)+'"><span class="ce">'+emo+'</span>'+esc(name)+'</button>';
  }).join('');
  $('more-cats').textContent = showAllCats ? 'Ver menos ▴' : 'Ver todas ▾';
  $('more-cats').style.display = list.length>CATS_VISIBLES ? '' : 'none';
}
$('more-cats').addEventListener('click',function(){ showAllCats=!showAllCats; renderCats(); });

function renderObsList(){
  var seen={}, opts=[];
  entries.slice().sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); }).forEach(function(e){
    if(e.observacion && visible(e) && e.categoria===state.cat && !seen[e.observacion]){ seen[e.observacion]=1; opts.push(e.observacion); }
  });
  $('obs-list').innerHTML=opts.slice(0,8).map(function(o){ return '<option value="'+esc(o)+'">'; }).join('');
}

/* ---------- Selección de toggles ---------- */
function selectToggle(group,val){
  document.querySelectorAll('[data-group="'+group+'"]').forEach(function(b){
    b.classList.remove('sel','sofi-s','guille-s','cat-s');
    if(b.getAttribute('data-val')===val){
      b.classList.add('sel');
      if(group==='pag') b.classList.add(val==='Sofi'?'sofi-s':'guille-s');
      if(group==='cat') b.classList.add('cat-s');
      if(group==='modo') b.classList.add(val==='ing'?'ing-s':val==='pers'?'pers-s':'cat-s');
    }
  });
  var cambioModo = group==='modo' && state.modo!==val;
  state[group]=val;
  if(group==='modo'){
    var comp = val==='comp';
    $('field-pag').style.display = comp ? '' : 'none';
    $('field-yapagado').style.display = comp && state.cat!==CAT_SALDO ? '' : 'none';
    if(!comp){ selectToggle('pag',usuario||'Sofi'); selectToggle('yapagado','No'); }
    $('savebtn').classList.toggle('editing', !!editingId);
    if(cambioModo){ state.cat=null; showAllCats=false; renderCats(); }
    $('importe').dispatchEvent(new Event('input'));
  }
  if(group==='cat'){
    var isSaldo = val===CAT_SALDO;
    $('field-yapagado').style.display = isSaldo || state.modo!=='comp' ? 'none' : '';
    if(isSaldo) selectToggle('yapagado','No');
    renderObsList();
  }
}
document.addEventListener('click',function(e){

  selectToggle(btn.getAttribute('data-group'), btn.getAttribute('data-val'));

/* ---------- Datos ---------- */
function load(cb){
  sync('syncing');
  fetch(CSV_URL+'&t='+Date.now())
    .then(function(r){ return r.text(); })
    .then(function(text){
      // columnas: id(0) fecha(1) pagador(2) categoria(3) importe(4) pagado(5) observacion(6) tipo(7) ambito(8)
      entries=parseCSV(text).map(function(r){
        return { id:String(r[0]||''), fecha:r[1]||'', pagador:r[2]||'', categoria:r[3]||'',
                 importe:parseFloat(r[4])||0, pagado:(r[5]||'').trim()==='Si', observacion:(r[6]||'').trim(),
                 tipo:(r[7]||'').trim()==='Ingreso'?'Ingreso':'Gasto',
                 ambito:(r[8]||'').trim()==='Personal'?'Personal':'Compartido' };
      }).filter(function(e){ return e.id && e.importe>0; });
      sync('ok'); fillMonths(); if(cb) cb();
    })
    .catch(function(err){ console.error(err); sync('error'); toast('Sin conexion'); if(cb) cb(); });
}
function post(body,cb){
  sync('syncing');
  fetch(SCRIPT,{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body) })
    .then(function(r){ return r.text(); })
    .then(function(){ sync('ok'); cb&&cb(true); })
    .catch(function(err){ console.error(err); sync('error'); cb&&cb(false); });
}

function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function adivinarCategoria(texto,permitidas){
  var t=' '+norm(texto)+' ';
  permitidas=permitidas||CATS;
  // 1) lo que ustedes ya escribieron antes como nota (aprende solo)
  var best=null, bestLen=0;
  entries.forEach(function(e){
    if(permitidas.indexOf(e.categoria)<0 || !visible(e)) return;
    var o=norm(e.observacion||'');
    if(o.length>=3 && o.length>bestLen && t.indexOf(' '+o)>=0){ best=e.categoria; bestLen=o.length; }
  });
  if(best) return best;
  // 2) palabras clave (la más larga gana: "gaseosa" antes que "gas")
  var pares=[];
  Object.keys(KEYWORDS).forEach(function(c){ if(permitidas.indexOf(c)>=0) KEYWORDS[c].forEach(function(k){ pares.push([k,c]); }); });
  pares.sort(function(a,b){ return b[0].length-a[0].length; });
  for(var i=0;i<pares.length;i++){
    if(new RegExp('\\b'+pares[i][0]).test(t)) return pares[i][1];
  }
  return null;
}

function interpretar(txt){
  var res={ importe:NaN, cat:null, pagador:null, nota:'', ayer:false, modo:null };
  // "+120000 freelance" → ingreso
  if(/^\s*\+/.test(txt)){ res.modo='ing'; txt=txt.replace(/^\s*\+/,''); }
  var m=txt.match(/\$?\s*\d[\d.,]*(\s*\+\s*\d[\d.,]*)*/);
  if(m){ res.importe=parseImporte(m[0]); txt=txt.replace(m[0],' '); }
  var words=txt.split(/\s+/).filter(Boolean), resto=[];
  words.forEach(function(w){
    var n=norm(w);
    if(n==='sofi') res.pagador='Sofi';
    else if(n==='guille') res.pagador='Guille';
    else if(n==='ayer') res.ayer=true;
    else if(n==='personal'||n==='mio'||n==='mia'){ if(!res.modo) res.modo='pers'; }
    else resto.push(w);
  });
  res.nota=resto.join(' ');
  if(res.modo){ res.cat=adivinarCategoria(res.nota,catsDeModo(res.modo)); }
  else {
    // si no se aclaró, primero ¿es un ingreso? (sueldo, aguinaldo...), si no, compartido
    var ing=adivinarCategoria(res.nota,CATS_ING);
    if(ing){ res.modo='ing'; res.cat=ing; }
    else { res.cat=adivinarCategoria(res.nota,CATS); res.modo='comp';
      if(!res.cat){ var p=adivinarCategoria(res.nota,CATS_PERS); if(p){ res.cat=p; res.modo='pers'; } } }
  }
  return res;
}

function cargaRapida(){
  var q=$('quick'), r=interpretar(q.value);
  if(isNaN(r.importe)||r.importe<=0){ $('quick-hint').innerHTML='<span style="color:#f87171">No encontré el monto. Ej: "3000 gaseosa"</span>'; return; }
  selectToggle('modo',r.modo||state.modo);
  $('importe').value=r.importe; $('importe').dispatchEvent(new Event('input'));
  $('observacion').value=r.nota ? r.nota.charAt(0).toUpperCase()+r.nota.slice(1) : '';
  $('fecha').value = r.ayer ? daysAgoStr(1) : todayStr(); syncDateChips();
  if(r.pagador) selectToggle('pag',r.pagador);
  if(r.cat){
    state.cat=r.cat; renderCats(); selectToggle('cat',r.cat);
    var etiqueta={comp:'compartido',pers:'personal',ing:'ingreso'}[state.modo];
    $('quick-hint').innerHTML='✓ '+ars(r.importe)+' en <b style="color:#fff">'+esc(r.cat)+'</b> ('+etiqueta+'). Tocá Listo otra vez para guardar.';
    q.setAttribute('data-ready','1');
  } else {
    state.cat=null; renderCats();
    $('quick-hint').innerHTML='No sé qué categoría es "'+esc(r.nota)+'". Elegila abajo 👇 (la próxima la recuerdo)';
  }
}

  cargaRapida();
}

/* ---------- Análisis y recomendaciones ---------- */
var DISCRECIONALES = ['🎉 Salidas','🚕 Ubers','🍕 Delivery','💼 Comidas Trabajo'];
var FIJOS = ['🏠 Alquiler','🗒️ Expensas','💡 Luz','💧 Agua','🔥 Gas','🛜 Internet'];

function monthKeyOffset(n){ var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-n); return d.getFullYear()+'-'+d.getMonth(); }
// El análisis es sobre los gastos compartidos del hogar
function gastosMes(key){ return entries.filter(function(e){ return mk(e.fecha)===key && esComp(e) && e.categoria!==CAT_SALDO; }); }
function ingresosHogar(key){ return suma(entries.filter(function(e){ return mk(e.fecha)===key && e.tipo==='Ingreso'; })); }
function gastosHogar(key){ return suma(entries.filter(function(e){ return mk(e.fecha)===key && e.tipo==='Gasto' && e.categoria!==CAT_SALDO; })); }
function porCat(list){ var o={}; list.forEach(function(e){ o[e.categoria]=(o[e.categoria]||0)+e.importe; }); return o; }
function suma(list){ return list.reduce(function(a,b){ return a+b.importe; },0); }

function renderAnalisis(){
  var now=new Date(), dia=now.getDate();
  var diasMes=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var cur=gastosMes(curMK()), totalCur=suma(cur), catCur=porCat(cur);

  // Promedio de los últimos 3 meses con datos
  var prev=[], prevCats={};
  for(var i=1;i<=3;i++){
    var g=gastosMes(monthKeyOffset(i)); if(!g.length) continue;
    prev.push(suma(g));
    var pc=porCat(g); Object.keys(pc).forEach(function(c){ (prevCats[c]=prevCats[c]||[]).push(pc[c]); });
  }
  var nPrev=prev.length;
  var promTotal = nPrev ? prev.reduce(function(a,b){return a+b;},0)/nPrev : 0;
  function promCat(c){ var a=prevCats[c]; return a ? a.reduce(function(x,y){return x+y;},0)/nPrev : 0; }

  // Proyección: fijos tal cual, variables por ritmo diario
  var fijosCur=0, varCur=0;
  Object.keys(catCur).forEach(function(c){ if(FIJOS.indexOf(c)>=0) fijosCur+=catCur[c]; else varCur+=catCur[c]; });
  var fijosEsperados=0; FIJOS.forEach(function(c){ fijosEsperados+=Math.max(catCur[c]||0, promCat(c)); });
  var proyeccion = fijosEsperados + varCur/dia*diasMes;

  var h='';
  if(!entries.length){ $('a-content').innerHTML='<div class="empty">Todavía no hay datos para analizar</div>'; return; }

  h+='<div class="stat-grid">'
    +'<div class="stat"><div class="slabel">Llevan gastado</div><div class="sval">'+ars(totalCur)+'</div><div class="res-meta">día '+dia+' de '+diasMes+'</div></div>'
    +'<div class="stat"><div class="slabel">Proyección del mes</div><div class="sval" style="color:'+(nPrev&&proyeccion>promTotal*1.05?'#DC2626':'#16A34A')+'">'+ars(proyeccion)+'</div>'
    +(nPrev?'<div class="res-meta">promedio: '+ars(promTotal)+'</div>':'')+'</div></div>';

  if(nPrev){
    var diff=proyeccion-promTotal;
    h+='<div class="balance-card '+(diff>promTotal*0.05?'debe':'ok')+'"><div class="b-label">A este ritmo</div><div class="b-main">'
      +(diff>promTotal*0.05 ? 'Van a gastar '+ars(diff)+' más que su promedio' : diff< -promTotal*0.05 ? 'Van '+ars(-diff)+' por debajo del promedio 👏' : 'Van en línea con su promedio')
      +'</div><div class="b-sub">Para no pasarse: máximo '+ars(Math.max(0,(promTotal-fijosEsperados-varCur)/Math.max(1,diasMes-dia+1)))+' por día en gastos variables</div></div>';
  }

  // Ingresos del hogar (solo el total, sin detalle de quién)
  var ingH=ingresosHogar(curMK());
  if(ingH>0){
    var gH=gastosHogar(curMK()), pct=Math.round(gH/ingH*100);
    h+='<div class="balance-card '+(pct>90?'debe':'ok')+'"><div class="b-label">Hogar este mes</div>'
      +'<div class="b-main">Gastaron el '+pct+'% de lo que entró</div>'
      +'<div class="b-sub">Entró '+ars(ingH)+' · gastado (compartido + personal) '+ars(gH)+' · queda '+ars(ingH-gH)+'</div></div>';
  }

  // Tendencia 6 meses
  var meses=[], mx=1;
  for(var j=5;j>=0;j--){ var k=monthKeyOffset(j), t=suma(gastosMes(k)); meses.push([k,t]); if(t>mx) mx=t; }
  h+='<div class="card"><div class="cats-title">Últimos 6 meses</div><div class="trend">'
    +meses.map(function(m,idx){
      var p=m[0].split('-');
      return '<div class="trend-col"><div class="trend-val">'+(m[1]?Math.round(m[1]/1000)+'k':'')+'</div>'
        +'<div class="trend-bar'+(idx===5?' cur':'')+'" style="height:'+Math.round(m[1]/mx*80)+'%"></div>'
        +'<div class="trend-lbl">'+MESES[+p[1]].slice(0,3)+'</div></div>';
    }).join('')+'</div></div>';

  // ---- Recomendaciones ----
  var recos=[];
  // a) categorías que se dispararon vs promedio (proyectadas)
  Object.keys(catCur).forEach(function(c){
    if(FIJOS.indexOf(c)>=0) return;
    var pr=promCat(c); if(!pr) return;
    var proy=catCur[c]/dia*diasMes;
    if(proy>pr*1.25 && proy-pr>5000){
      recos.push({ico:'📈', peso:proy-pr, t:c+' viene '+Math.round((proy/pr-1)*100)+'% arriba',
        d:'Llevan '+ars(catCur[c])+'. A este ritmo cierran en '+ars(proy)+' contra un promedio de '+ars(pr)+'.',
        s:'Volviendo al promedio: '+ars(proy-pr)});
    }
  });
  // b) gastos discrecionales (base: últimos 3 meses)
  var base = nPrev ? null : catCur;
  DISCRECIONALES.forEach(function(c){
    var v = nPrev ? promCat(c) : (catCur[c]||0);
    var tot = nPrev ? promTotal : totalCur;
    if(v>0 && tot>0 && v/tot>0.08){
      var tips={'🍕 Delivery':'Cocinar de más un día y congelar, o fijar 1 delivery por semana.',
                '🚕 Ubers':'Agrupar viajes, colectivo/subte cuando no es de noche, o compartir con alguien.',
                '🎉 Salidas':'Alternar salidas con planes en casa, aprovechar promos bancarias de 2x1 o descuentos.',
                '💼 Comidas Trabajo':'Llevar vianda 2–3 días por semana.'};
      recos.push({ico:'✂️', peso:v*0.3, t:c+' es el '+Math.round(v/tot*100)+'% de lo que gastan',
        d:tips[c]||'Es un gasto que se puede achicar.', s:'Recortando 30%: '+ars(v*0.3)+'/mes'});
    }
  });
  // c) delivery vs comida en casa
  var comida = ['🛒 Super','🥗 Verduleria','🥩 Carnes','🥐 Panaderia'].reduce(function(a,c){ return a+(nPrev?promCat(c):(catCur[c]||0)); },0);
  var deliv = nPrev?promCat('🍕 Delivery'):(catCur['🍕 Delivery']||0);
  if(deliv>0 && comida>0 && deliv/comida>0.4){
    recos.push({ico:'🍳', peso:deliv*0.5, t:'Delivery = '+Math.round(deliv/comida*100)+'% de lo que gastan en comida para casa',
      d:'Cada pedido suele costar 3–4 veces más que cocinarlo. Planear el menú de la semana ayuda mucho.', s:'Mitad de delivery: '+ars(deliv*0.5)+'/mes'});
  }
  // d) gastos hormiga (muchos chicos)
  var chicos=cur.filter(function(e){ return e.importe<=5000 && FIJOS.indexOf(e.categoria)<0; });
  if(chicos.length>=8){
    var sc=suma(chicos);
    recos.push({ico:'🐜', peso:sc*0.3, t:chicos.length+' gastos chicos este mes',
      d:'Suman '+ars(sc)+' entre compras de menos de $5.000. Comprar en una sola salida al super evita los "ya que estoy".',
      s:'Evitando 1 de cada 3: '+ars(sc/3)});
  }
  // e) super: compras frecuentes vs mayoristas
  var superN=cur.filter(function(e){ return e.categoria==='🛒 Super'; }).length;
  if(superN>=6){
    recos.push({ico:'🛒', peso:(catCur['🛒 Super']||0)*0.15, t:'Fueron '+superN+' veces al super este mes',
      d:'Una compra grande cada 15 días (mayorista o con promos del banco) y reposición mínima en el medio suele ahorrar 10–20%.',
      s:'Aprox: '+ars((catCur['🛒 Super']||0)*0.15)});
  }
  // f) fijos muy altos
  var fijosProm=0; FIJOS.forEach(function(c){ fijosProm+=nPrev?promCat(c):(catCur[c]||0); });
  var totRef=nPrev?promTotal:totalCur;
  if(totRef && fijosProm/totRef>0.6){
    recos.push({ico:'🏠', peso:1, t:'Los fijos son el '+Math.round(fijosProm/totRef*100)+'% del gasto',
      d:'Queda poco margen en lo variable. Revisen plan de internet/celular y tarifas sociales o planes de pago en servicios.', s:''});
  }
  // g) servicios que subieron
  ['💡 Luz','💧 Agua','🔥 Gas','🛜 Internet'].forEach(function(c){
    var pr=promCat(c); if(pr && catCur[c]>pr*1.3){
      recos.push({ico:'⚡', peso:catCur[c]-pr, t:c+' subió '+Math.round((catCur[c]/pr-1)*100)+'%',
        d:'Fijate si fue aumento de tarifa o de consumo. Si es consumo: stand-by, termotanque, calefacción/aire a temperatura moderada.', s:''});
    }
  });

  recos.sort(function(a,b){ return b.peso-a.peso; });
  var ahorro=recos.reduce(function(a,r){ var m=(r.s||'').match(/\$([\d.]+)/); return a+(m?+m[1].replace(/\./g,''):0); },0);

  h+='<div class="card"><div class="cats-title">Dónde recortar'+(ahorro?' · hasta '+ars(ahorro)+'/mes':'')+'</div>';
  if(!recos.length) h+='<div class="empty" style="padding:20px">Vienen bien 👌 No hay nada fuera de lo normal.'+(nPrev<2?'<br><br>Con más meses cargados las recomendaciones son más precisas.':'')+'</div>';
  recos.slice(0,6).forEach(function(r){
    h+='<div class="reco"><div class="reco-ico">'+r.ico+'</div><div><div class="reco-t">'+esc(r.t)+'</div><div class="reco-d">'+esc(r.d)+'</div>'
      +(r.s?'<span class="reco-save">💰 '+esc(r.s)+'</span>':'')+'</div></div>';
  });
  h+='</div>';

  // Comparativa por categoría
  if(nPrev){
    var cats=Object.keys(catCur).concat(Object.keys(prevCats)).filter(function(c,i,a){ return a.indexOf(c)===i; });
    cats.sort(function(a,b){ return (catCur[b]||0)-(catCur[a]||0); });
    h+='<div class="card"><div class="cats-title">Este mes vs promedio</div>';
    cats.forEach(function(c){
      var v=catCur[c]||0, p=promCat(c), d=p?Math.round((v/p-1)*100):null;
      h+='<div class="res-entry"><div class="res-left"><div class="res-name">'+esc(c)+'</div><div class="res-meta">prom. '+ars(p)+'</div></div>'
        +'<div class="res-right"><div class="res-total" style="color:#1A1916">'+ars(v)+'</div>'
        +(d!==null?'<div class="res-split" style="color:'+(d>0?'#DC2626':'#16A34A')+'">'+(d>0?'+':'')+d+'%</div>':'')+'</div></div>';
    });
    h+='</div>';
  }
  $('a-content').innerHTML=h;
}

/* ---------- Formulario ---------- */
function resetForm(){
  editingId=null;
  $('edit-banner').style.display='none';
  $('savebtn').textContent='Guardar';
  $('savebtn').classList.remove('editing');
  $('cancelbtn').style.display='none';
  $('importe').value='';
  $('amount-hint').innerHTML='Podés sumar: 1500+800+320';
  $('fecha').value=todayStr(); syncDateChips();
  $('observacion').value='';
  $('quick').value=''; $('quick').removeAttribute('data-ready');
  $('quick-hint').innerHTML='Escribí monto + qué fue. Ej: "12500 coto", "4800 uber guille"';
  state.cat=null; showAllCats=false;
  selectToggle('modo','comp');
  renderCats();
  selectToggle('pag',usuario||'Sofi');
  selectToggle('yapagado','No');
  $('field-yapagado').style.display='';
}
$('cancelbtn').addEventListener('click',resetForm);

function fillForm(e,isEdit){
  showTab('cargar');
  editingId = isEdit ? e.id : null;
  $('edit-banner').style.display = isEdit ? '' : 'none';
  $('savebtn').textContent = isEdit ? 'Guardar cambios' : 'Guardar';
  $('savebtn').classList.toggle('editing',!!isEdit);
  $('cancelbtn').style.display='';
  $('importe').value=e.importe;
  $('importe').dispatchEvent(new Event('input'));
  var d=new Date(e.fecha);
  $('fecha').value = isEdit && !isNaN(d.getTime()) ? dateStr(d) : todayStr();
  syncDateChips();
  $('observacion').value=e.observacion||'';
  selectToggle('modo',modoDe(e));
  state.cat=e.categoria; renderCats(); selectToggle('cat',e.categoria);
  selectToggle('pag',e.pagador);
  selectToggle('yapagado',e.pagado?'Si':'No');
}

function guardar(){
  var btn=$('savebtn'); if(btn.disabled) return;
  var imp=parseImporte($('importe').value);
  if(!imp||imp<=0){ toast('Ingresá un importe válido'); $('importe').focus(); return; }
  if(!state.cat){ toast('Elegí una categoría'); return; }
  var fechaVal=$('fecha').value;
  if(!fechaVal){ toast('Ingresá una fecha'); return; }
  btn.disabled=true; btn.textContent='Guardando...';

  var wasEditing=!!editingId;
  var body={
    action: wasEditing?'edit':'add',
    id: editingId||String(Date.now()),
    fecha: new Date(fechaVal+'T12:00:00').toISOString(),
    pagador: state.modo==='comp' ? state.pag : usuario,
    categoria: state.cat, importe: imp,
    pagado: state.modo!=='comp'||state.cat===CAT_SALDO ? 'No' : state.yapagado,
    observacion: $('observacion').value.trim(),
    tipo: state.modo==='ing' ? 'Ingreso' : 'Gasto',
    ambito: state.modo==='comp' ? 'Compartido' : 'Personal'
  };

  post(body,function(ok){
    btn.disabled=false;
    if(ok){
      // Actualizamos la lista local al instante (sin esperar a Google)
      var local={ id:body.id, fecha:body.fecha, pagador:body.pagador, categoria:body.categoria,
                  importe:imp, pagado:body.pagado==='Si', observacion:body.observacion,
                  tipo:body.tipo, ambito:body.ambito };
      entries=entries.filter(function(x){ return x.id!==body.id; }).concat([local]);
      fillMonths();
      toast((wasEditing?'Cambios guardados':'Guardado')+' ✓ '+ars(imp));
      resetForm();
      if(wasEditing) showTab('historial');
      setTimeout(function(){ load(function(){ renderHist(); renderRes(); renderMio(); }); },2500);
    } else {
      btn.textContent=wasEditing?'Guardar cambios':'Guardar';
      toast('Error al guardar');
    }
  });
}
$('savebtn').addEventListener('click',guardar);

function fillMonths(){
  var hv=$('h-mes').value, rv=$('r-mes').value, mv=$('m-mes').value, keys=[];
  entries.forEach(function(e){ var k=mk(e.fecha); if(k&&keys.indexOf(k)<0) keys.push(k); });
  var cur=curMK(); if(keys.indexOf(cur)<0) keys.push(cur);
  keys.sort(function(a,b){ var A=a.split('-'),B=b.split('-'); return (B[0]-A[0])||(B[1]-A[1]); });
  var opts=keys.map(function(k){ var p=k.split('-'); return '<option value="'+k+'">'+MESES[+p[1]]+' '+p[0]+'</option>'; }).join('');
  $('h-mes').innerHTML=opts; $('r-mes').innerHTML=opts; $('m-mes').innerHTML=opts;
  $('m-mes').value = keys.indexOf(mv)>=0 ? mv : cur;
  // conserva el mes que estabas mirando
  $('h-mes').value = keys.indexOf(hv)>=0 ? hv : cur;
  $('r-mes').value = keys.indexOf(rv)>=0 ? rv : cur;
}

/* ---------- Historial ---------- */

  if(!list.length){ el.innerHTML='<div class="empty">Sin registros este mes</div>'; return; }

    var isSaldo=e.categoria===CAT_SALDO, modo=modoDe(e), verde=isSaldo||modo==='ing';

      +'</div><div class="entry-right">'

      +'<button type="button" class="ibtn" data-act="edit" data-id="'+esc(e.id)+'" title="Editar">✏️</button>'
      +'<button type="button" class="ibtn" data-act="del" data-id="'+esc(e.id)+'" title="Eliminar">✕</button>'
      +'</div></div><div class="entry-meta">'
      +(modo==='ing'?'<span class="badge bing">💰 Ingreso</span>'
        :modo==='pers'?'<span class="badge bpers">👤 Personal</span>'
        :'<span class="badge '+(e.pagador==='Sofi'?'bs':'bg')+'">'+esc(e.pagador)+' pagó</span>')
      +(e.pagado&&!isSaldo?'<span class="badge bok">c/u pagó su mitad</span>':'')

$('h-list').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b) return;
  var id=b.getAttribute('data-id'), act=b.getAttribute('data-act');
  var e=entries.find(function(x){ return x.id===id; }); if(!e) return;
  if(act==='edit') fillForm(e,true);
  if(act==='rep'){ fillForm(e,false); toast('Revisá y tocá Guardar'); }
  if(act==='del') delEntry(id);
});

function delEntry(id){
  if(!confirm('¿Eliminás este gasto?')) return;
  post({action:'delete',id:id},function(ok){
    if(ok){
      entries=entries.filter(function(x){ return x.id!==id; });
      renderHist(); renderMio(); toast('Eliminado');
      setTimeout(function(){ load(renderHist); },2500);
    } else toast('Error al eliminar');
  });
}

/* ---------- Balance ---------- */
// neto > 0 → Sofi le debe a Guille; neto < 0 → Guille le debe a Sofi
function calcNeto(key){
  var neto=0;
  entries.forEach(function(e){
    if(mk(e.fecha)!==key || e.pagado || !esComp(e)) return;
    if(e.categoria===CAT_SALDO){ neto += e.pagador==='Sofi' ? -e.importe : e.importe; return; }
    neto += e.pagador==='Guille' ? e.importe/2 : -e.importe/2;
  });
  return neto;
}
function calcSaldoAnt(key){
  var p=key.split('-'), y=+p[0], m=+p[1], total=0, keys={};
  entries.forEach(function(e){ var k=mk(e.fecha); if(k) keys[k]=1; });
  Object.keys(keys).forEach(function(k){
    var kp=k.split('-'), ky=+kp[0], km=+kp[1];
    if(ky<y||(ky===y&&km<m)) total+=calcNeto(k);
  });
  return total;
}

function renderRes(){
  var key=$('r-mes').value;
  // Solo lo compartido; ingresos y personales quedan fuera (salvo el total del hogar)
  var list=entries.filter(function(e){ return mk(e.fecha)===key && esComp(e); });
  var gastos=list.filter(function(e){ return e.categoria!==CAT_SALDO; });
  var totalMes=gastos.reduce(function(a,b){ return a+b.importe; },0);
  var totalDeuda=gastos.filter(function(e){ return !e.pagado; }).reduce(function(a,b){ return a+b.importe; },0);
  var netoMes=calcNeto(key), saldoAnt=calcSaldoAnt(key), netoTotal=netoMes+saldoAnt;
  var h='<div class="stat-grid">'
    +'<div class="stat"><div class="slabel">Total del mes</div><div class="sval">'+ars(totalMes)+'</div></div>'
    +'<div class="stat"><div class="slabel">Mitad c/u (pendiente)</div><div class="sval">'+ars(totalDeuda/2)+'</div></div></div>';

  if(Math.abs(saldoAnt)>1){
    h+='<div class="saldo-card"><div class="saldo-label">Saldo anterior</div><div class="saldo-val">'
      +(saldoAnt>0?'Sofi':'Guille')+' venía debiendo '+ars(Math.abs(saldoAnt))+'</div></div>';
  }
  var balOk=Math.abs(netoTotal)<1, deudor=netoTotal>0?'Sofi':'Guille', acreedor=netoTotal>0?'Guille':'Sofi';

    +(!balOk?'<div class="b-sub">Este mes: '+ars(Math.abs(netoMes))+(Math.abs(saldoAnt)>1?' + arrastre '+ars(Math.abs(saldoAnt)):'')+'</div>'
      +'<button type="button" class="saldar-btn" id="saldar" data-deudor="'+deudor+'" data-monto="'+Math.round(Math.abs(netoTotal))+'">💸 Cargar pago de '+deudor+'</button>':'')
    +'</div>';

  if(list.length){
    var pc={};
    gastos.forEach(function(e){ pc[e.categoria]=(pc[e.categoria]||0)+e.importe; });

          +'<div style="display:flex;gap:10px;margin-top:3px;font-size:11px;">'
          +(pS>0?'<span style="color:#C9406A">Sofi '+ars(pS)+'</span>':'')
          +(pG>0?'<span style="color:#2563EB">Guille '+ars(pG)+'</span>':'')
          +'</div></div>';
      });
      h+='</div>';
    }
    h+='<div class="card"><div class="cats-title">Todos los movimientos</div>';
    list.slice().sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); }).forEach(function(e){
      h+='<div class="res-entry"><div class="res-left"><div class="res-name">'+esc(e.categoria)

        +'</div><div class="res-meta">'+fmtDate(e.fecha)+'</div></div>'

        +(e.categoria===CAT_SALDO?' · pago de deuda':e.pagado?' · <span style="color:#16A34A">ya pagado c/u</span>':' · c/u '+ars(e.importe/2))
        +'</div></div></div>';

    h+='</div>';
  } else h+='<div class="empty">Sin gastos este mes</div>';

  // Total del hogar: suma de ingresos de los dos, sin detalle por persona

      +'<div class="stat"><div class="slabel">'+(aho>=0?'Ahorro':'En rojo')+'</div><div class="sval" style="color:'+(aho>=0?'#16A34A':'#DC2626')+'">'+ars(Math.abs(aho))+'</div>'
      +'<div class="res-meta">'+Math.round(aho/ingH*100)+'% de lo que entró</div></div></div>'
      +'<div class="res-meta" style="margin-top:8px">Gastos totales (compartidos + personales): '+ars(gH)+'</div></div>';
  }

/* ---------- Lo mío (solo lo ve cada uno) ---------- */
function renderMio(){

    +'<div class="stat"><div class="slabel">'+(queda>=0?'Me queda':'En rojo')+'</div><div class="sval" style="color:'+(queda>=0?'#16A34A':'#DC2626')+'">'+ars(Math.abs(queda))+'</div>'

  if(pers.length){

    });
    h+='</div>';
  } else h+='<div class="empty">Sin movimientos personales este mes</div>';
  h+='<div class="res-meta" style="text-align:center;margin-top:8px">🔒 Esta pestaña solo te la muestra la app a vos</div>';
  $('m-content').innerHTML=h;
}
// Botón "Cargar pago": deja el formulario listo con el saldo de deuda
$('r-content').addEventListener('click',function(ev){
  var b=ev.target.closest('#saldar'); if(!b) return;
  fillForm({ importe:+b.getAttribute('data-monto'), categoria:CAT_SALDO, pagador:b.getAttribute('data-deudor'), pagado:false, observacion:'' },false);
  toast('Revisá el monto y tocá Guardar');
});

try{ var su=localStorage.getItem('comp_user'); if(su) setUsuario(su); }catch(e){}
</script>
